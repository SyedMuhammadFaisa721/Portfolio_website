<!-- 1. Infinite Tech Stack Carousel -->
 {% load static %}
 {% block extra_css %}
<link rel="stylesheet" href="{% static 'css/test.css' %}">
{% endblock %}
<section class="tech-stack-section">
    <div class="tech-slider-container">
        <div class="tech-track">
            <!-- Set 1 -->
           

            <!-- Set 2 (Duplicate for Infinite Loop) -->
            <div class="tech-card"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="Python"><span>Python</span></div>
            <div class="tech-card"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/django/django-plain.svg" alt="Django"><span>Django</span></div>
            <div class="tech-card"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mysql/mysql-original.svg" alt="MySQL"><span>MySQL</span></div>
            <div class="tech-card"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/postgresql/postgresql-original.svg" alt="PostgreSQL"><span>PostgreSQL</span></div>
            <div class="tech-card"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/git/git-original.svg" alt="Git"><span>Git</span></div>
            <div class="tech-card"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" alt="GitHub"><span>GitHub</span></div>
            <div class="tech-card"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg" alt="HTML"><span>HTML</span></div>
            <div class="tech-card"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg" alt="CSS"><span>CSS</span></div>
            <div class="tech-card"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" alt="JavaScript"><span>JavaScript</span></div>
            <div class="tech-card"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/bootstrap/bootstrap-original.svg" alt="Bootstrap"><span>Bootstrap</span></div>
        </div>
    </div>
</section>

<!-- 2. Portfolio Stats Bar -->
<section class="stats-section">
    <div class="stats-container">
        <div class="stat-item">
            <div class="stat-icon-box">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            </div>
            <div class="stat-info">
                <h3>10+</h3>
                <p>Projects Completed</p>
            </div>
        </div>

        <div class="stat-divider"></div>

        <div class="stat-item">
            <div class="stat-icon-box">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path></svg>
            </div>
            <div class="stat-info">
                <h3>2+</h3>
                <p>Years Learning Python</p>
            </div>
        </div>

        <div class="stat-divider"></div>

        <div class="stat-item">
            <div class="stat-icon-box">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            </div>
            <div class="stat-info">
                <h3>5000+</h3>
                <p>Lines of Django Code</p>
            </div>
        </div>

        <div class="stat-divider"></div>

        <div class="stat-item">
            <div class="stat-icon-box">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            </div>
            <div class="stat-info">
                <h3>100%</h3>
                <p>Responsive Designs</p>
            </div>
        </div>
    </div>
</section>
